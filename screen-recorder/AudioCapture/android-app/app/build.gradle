    compileSdk 35

    defaultConfig {
        applicationId 'ai.arena.audiocapture'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
