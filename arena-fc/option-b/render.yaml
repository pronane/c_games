# Render blueprint: Arena FC + HD Fighter + Egyptian Fighter + TurboTumble64 on ONE web service.
# Copy it to the repository root to use it as a blueprint. Render needs a paid plan for Docker.
#
#   https://<app>.onrender.com/arena/          Arena FC web build
#   wss://<app>.onrender.com/arena/ws          -> shared Node hub -> .NET server on 127.0.0.1:7777
#   https://<app>.onrender.com/                HD Fighter;  /egyptian and /turbo are the C games' sockets
services:
  - type: web
    name: c-games-online
    runtime: docker
    dockerfilePath: ./arena-fc/option-b/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /arena/api/health      # 200 only while the .NET server is accepting connections
    envVars:
      - key: ARENA_ALLOWED_ORIGINS          # your public URL; empty allows any origin
        value: https://c-games-online.onrender.com
