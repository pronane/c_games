# =========================================================================
# Mario Kart 64 PC - EasySMX USB Controller & Game Configuration
# =========================================================================
# Supports ALL EasySMX USB & 2.4GHz Wireless Controllers automatically:
#   - XInput Mode (Default Windows Mode, EasySMX LED 1+2): Full analog sticks,
#     independent LT/RT analog triggers, and dual-motor Force-Feedback Rumble!
#   - DirectInput / D-Input Mode (EasySMX LED 1+3 or LED 1+4): Automatic
#     WinMM HID fallback with POV hat + 16-button mapping!
#
# You can also adjust all settings & rebind buttons live inside the game via:
#   Title Screen -> "EASYSMX USB CONTROLLER SETUP" (or press F1).
# =========================================================================

StickDeadzone=0.160
SteeringSensitivity=1.000
TriggerThreshold=0.280
EnableRumble=1
AllowRightTriggerGas=1

# XInput Button Bitmasks:
# 0x1000=A, 0x2000=B, 0x4000=X, 0x8000=Y, 0x0100=LB, 0x0200=RB
XInputBtnAccelerate=4096
XInputBtnBrake=8192
XInputBtnDriftHop=512
XInputBtnItem=256

# DirectInput Button Indices (0-based):
DInputBtnAccelerate=0
DInputBtnAltAccel=2
DInputBtnBrake=1
DInputBtnDriftHop=5
DInputBtnAltDrift=7
DInputBtnItem=4
DInputBtnAltItem=6
DInputBtnStart=9
DInputBtnSelect=8

# Audio & HUD Preferences
MusicVolume=0.65
SfxVolume=0.85
ShowSpeedometer=1
ShowMinimap=1
