name: Sprite Forge tests
on:
  push:
    paths: ["sprite_forge/**", "HD_Fighter/sprite_specs/**", "Gaelic_Football_3d/assets/models/**", ".github/workflows/sprite-forge-tests.yml"]
  pull_request:
    paths: ["sprite_forge/**", "HD_Fighter/sprite_specs/**", "Gaelic_Football_3d/assets/models/**", ".github/workflows/sprite-forge-tests.yml"]
jobs:
  limbs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sprite_forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-core.txt
      # renders a front mannequin with exact landmarks and checks all 14 fighter moves front / 35 deg / 90 deg:
      # limbs attached, one piece, feet present, no flapping, no snaps, no wrong-way knees / elbows
      - run: python tools/test_limbs.py --selftest limbs_selftest
      - run: python tools/test_v8.py
      # v10: HD Fighter hand-posed frames (attack peaks on frames 1-2, meta.json frame counts) + a full sculpt build
      - run: python tools/test_hd_v10.py kairo
      # v10.1: game-ready 3D character (Gaelic Football player): watertight, budget, UVs, weights, kits, clips kept
      - run: python tools/test_gamemesh.py
      # v10.2: appearance keys -> MakeHuman targets, template re-skinning, software renderer, squad parts table
      - run: python tools/test_look.py
      # v11.18: the Studio's Capture and Motion tabs (the window checks run under a virtual display)
      - run: xvfb-run -a python tools/test_studio_tabs.py
      # v11.19: the Games tab - a page per kind of game, every pack in game_packs/
      - run: xvfb-run -a python tools/test_game_tabs.py
      # v11.21: field-sport clips (skills, aerial control, chip/trivela/bicycle, conduct), their QA, bind conform
      - run: python tools/test_fieldsport.py
      - run: python tools/test_jointtrack.py
      # v11.23: rosters, portraits and the engine projects (Godot / Unity / Unreal / raylib / web / pygame)
      - run: python tools/test_engines.py
      # v11.24: distinct roster looks, every move inside its cell on every pack, numbered kits
      - run: python tools/test_roster_look.py
      # v11.25: per-pixel textures and smooth light in sprites, HD frames on every pack, the sports idle
      - run: python tools/test_render_quality.py
      # v11.26: match capture (tracker, 2D kick detector, the committed lifter round trip, merge)
      - run: pip install onnxruntime ijson && python tools/test_matchcapture.py
      # v11.27: hurling, Aussie rules and rugby packs, the hurley and helmet, rugby / guernsey kit cuts
      - run: python tools/test_new_sports.py
      # v11.28: textured multi-part GLBs (several identities on one skeleton)
      - run: python tools/test_glb_parts.py
      # v11.30: tailored kits (straight hems, draped cloth, boots without toes) and the kit atlas
      - run: python tools/test_tailor.py
      # v11.31: match officials (signal clips, kits, props, appending clips to a squad GLB)
      - run: python tools/test_officials.py
      # v11.32: stadiums (bowl / classic / ground, any sport's pitch), seat maps, crowd, LED boards
      - run: python tools/test_stadium.py
      # v11.33: turf masks (markings per sport, mowing patterns, wear)
      - run: python tools/test_pitch.py
      # v11.34: skin detail maps, material presets, textured identities via replace_parts
      - run: python tools/test_skinshade.py
      - run: python tools/test_skinlod.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: limbs-selftest
          path: sprite_forge/limbs_selftest
