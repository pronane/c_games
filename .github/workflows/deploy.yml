name: Deploy Online Multiplayer
on:
  push: { branches: [main] }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --prefix multiplayer
      - run: timeout 3 npm start --prefix multiplayer || true
