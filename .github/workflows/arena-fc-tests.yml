name: Arena FC tests
on:
  push:
    paths: ['arena-fc/**', 'shared/netplay/server/**', '.github/workflows/arena-fc-tests.yml']
  pull_request:
    paths: ['arena-fc/**', 'shared/netplay/server/**', '.github/workflows/arena-fc-tests.yml']

jobs:
  # Audio, replay, set-piece aim, rig builder and the browser edition's game loop, headless in Godot.
  # The .NET build is not needed (and not exercised) here.
  godot-gdscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2 (.NET build, used only as a GDScript runner)
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          unzip -q godot.zip -d godot
          echo "GODOT=$PWD/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          chmod +x godot/*/Godot_v4.7.2-stable_mono_linux.x86_64
      - run: arena-fc/Tools/run-gd-tests.sh

  # The shared Node hub with the Arena FC WebSocket proxy, against a fake game server.
  # The desktop game is C#.  Compile it with .NET 9 and run the pure-match-core
  # regression suite (possession stability, set pieces, human shots).  Without
  # this job a C# syntax/type error in Scripts/** only shows up on a Windows build.
  dotnet-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - name: Build the Godot C# assemblies with .NET 9
        working-directory: arena-fc
        run: dotnet build ArenaFC.sln -c Release -v:q
      - name: Build the authoritative .NET server (v2 protocol)
        working-directory: arena-fc
        run: dotnet build Server/ArenaFC.Server.csproj -c Release -v:q
      - name: Full C# core + protocol + rollback + online-client suite
        working-directory: arena-fc
        run: dotnet run --project Tests/CoreTests.csproj -c Release
      - name: Pure-C# match core regression tests
        working-directory: arena-fc
        run: dotnet run --project Tests/MatchCoreTests.csproj -c Release
      - name: Portable pad / gameplay static checks
        working-directory: arena-fc
        run: python3 Tools/test_pads.py

  node-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - working-directory: shared/netplay/server
        run: npm ci && npm test
      - name: Arena FC Node server against the protocol suites written for the .NET server
        working-directory: shared/netplay/server
        run: |
          node arena/standalone.js --port 7791 &
          sleep 2
          python3 ../../../arena-fc/Tools/net_smoketest.py --url ws://127.0.0.1:7791 --seconds 4
          python3 ../../../arena-fc/Tools/net_v2_smoketest.py --url ws://127.0.0.1:7791
