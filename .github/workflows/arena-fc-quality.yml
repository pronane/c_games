name: Arena FC quality gates

on:
  push:
    branches: ["arena/**"]
    paths:
      - "arena-fc/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "arena-fc/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arena-fc-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asset-contracts:
    name: Asset and Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python tooling
        run: python -m compileall -q arena-fc/Tools
      - name: Validate committed clip manifest and GLB container
        working-directory: arena-fc
        run: python Tools/ci_validate_assets.py

  simulation-stress:
    name: Seeded simulation stress and determinism
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRESS_SEEDS: ${{ github.event_name == 'schedule' && '12' || '3' }}
      STRESS_SECONDS: ${{ github.event_name == 'schedule' && '90' || '30' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Run deterministic 5v5, 7v7 and 11v11 stress scenarios
        working-directory: arena-fc
        run: |
          set -o pipefail
          dotnet run --project Tests/CiStressTests.csproj -c Release -- \
            --seeds "$STRESS_SEEDS" --seconds "$STRESS_SECONDS" 2>&1 | tee ci-stress.log
      - name: Upload simulation stress log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-fc-simulation-stress
          path: arena-fc/ci-stress.log
          if-no-files-found: warn

  dotnet-coverage:
    name: .NET core coverage report
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install native dependencies for the .NET coverage profiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2 libicu-dev zlib1g
          ldd --version | head -n 1
          ldconfig -p | grep -E 'libxml2\.so|libicuuc\.so' | head
      - name: Install cross-platform coverage collector
        run: |
          dotnet tool install --global dotnet-coverage --version 17.14.1
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Collect core test coverage
        working-directory: arena-fc
        run: |
          dotnet-coverage collect "dotnet run --project Tests/CoreTests.csproj -c Release" --output coverage-core.cobertura.xml --output-format cobertura
          test -s coverage-core.cobertura.xml
          grep -q '<class ' coverage-core.cobertura.xml
      - name: Collect match-core test coverage
        working-directory: arena-fc
        run: |
          dotnet-coverage collect "dotnet run --project Tests/MatchCoreTests.csproj -c Release" --output coverage-match-core.cobertura.xml --output-format cobertura
          test -s coverage-match-core.cobertura.xml
          grep -q '<class ' coverage-match-core.cobertura.xml
      - name: Upload Cobertura coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-fc-dotnet-coverage
          path: |
            arena-fc/coverage-core.cobertura.xml
            arena-fc/coverage-match-core.cobertura.xml
          if-no-files-found: warn

  benchmarks:
    name: Benchmarks (performance + gameplay vs base)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this change
        uses: actions/checkout@v4
        with:
          path: head
      - name: Work out the base to compare with
        id: base
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -z "$base" ] && base="${{ github.event.before }}"
          case "$base" in ""|0000000000000000000000000000000000000000) base="";; esac
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Check out the base
        if: steps.base.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build the benchmarks for this change and for the base
        run: |
          dotnet build -c Release head/arena-fc/Tests/Benchmarks/Benchmarks.csproj -v:q
          if [ -d base/arena-fc ]; then
            # same benchmark code for both, so only the game differs
            rm -rf base/arena-fc/Tests/Benchmarks
            cp -r head/arena-fc/Tests/Benchmarks base/arena-fc/Tests/Benchmarks
            rm -rf base/arena-fc/Tests/Benchmarks/bin base/arena-fc/Tests/Benchmarks/obj
            dotnet build -c Release base/arena-fc/Tests/Benchmarks/Benchmarks.csproj -v:q \
              || { echo "::warning::the base does not build with these benchmarks; reporting this change only"; rm -rf base; }
          fi
      - name: Run (base and this change alternately, on this runner)
        run: |
          out="$RUNNER_TEMP/bench"; mkdir -p "$out"
          for i in 1 2 3; do
            if [ -d base/arena-fc ]; then
              (cd base/arena-fc && dotnet Tests/Benchmarks/bin/Release/net9.0/Benchmarks.dll perf --reps 5 --out "$out/base_perf_$i.json" > /dev/null)
            fi
            (cd head/arena-fc && dotnet Tests/Benchmarks/bin/Release/net9.0/Benchmarks.dll perf --reps 5 --out "$out/head_perf_$i.json" > /dev/null)
          done
          if [ -d base/arena-fc ]; then
            (cd base/arena-fc && dotnet Tests/Benchmarks/bin/Release/net9.0/Benchmarks.dll gameplay --matches 8 --out "$out/base_gameplay.json" > /dev/null)
          fi
          (cd head/arena-fc && dotnet Tests/Benchmarks/bin/Release/net9.0/Benchmarks.dll gameplay --matches 8 --out "$out/head_gameplay.json" > /dev/null)
      - name: Compare with the base
        run: |
          out="$RUNNER_TEMP/bench"
          python3 head/arena-fc/Tools/compare_benchmarks.py \
            --base-perf $(ls "$out"/base_perf_*.json 2>/dev/null) --head-perf "$out"/head_perf_*.json \
            $( [ -f "$out/base_gameplay.json" ] && echo --base-gameplay "$out/base_gameplay.json" ) \
            --head-gameplay "$out/head_gameplay.json" \
            --targets head/arena-fc/Tools/benchmark_targets.json \
            --summary "$GITHUB_STEP_SUMMARY" --out "$out/comparison.json"
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-fc-benchmarks
          retention-days: 30
          path: ${{ runner.temp }}/bench/
          if-no-files-found: warn

  gameplay-recording:
    name: Gameplay recording (video + targets)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write     # to delete this branch's older recordings
    env:
      RECORD_FRAMES: "600"     # 20 s at 30 fps
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install software rendering, virtual display and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils ffmpeg
      - name: Download Godot 4.7.2 Mono
        run: |
          curl -fsSL -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          chmod +x "$RUNNER_TEMP"/godot/*/Godot_v4.7.2-stable_mono_linux.x86_64
      - name: Build Godot C# assemblies
        working-directory: arena-fc
        run: dotnet build ArenaFC.sln -c Release -v:q
      - name: Import Godot resources (textures, materials and scene assets)
        working-directory: arena-fc
        run: '"$GODOT" --headless --editor --path . --import --quit'
      - name: Record an 11v11 AI-vs-AI match (Godot movie maker, fixed 30 fps)
        working-directory: arena-fc
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          out="$RUNNER_TEMP/gameplay-recording"
          mkdir -p "$out"
          # --write-movie renders every frame at a fixed 30 fps, so the video plays at real
          # speed whatever the runner's speed; --gameplay-report writes what happened in it.
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --write-movie "$out/match.avi" --fixed-fps 30 --quit-after "$RECORD_FRAMES" \
            -- --match --size 11 --seed 2026 --ai-vs-ai --gameplay-report "$out/gameplay.json" \
            2>&1 | tee "$out/godot.log"
          test -s "$out/match.avi"
          test -s "$out/gameplay.json"
      - name: Encode the recording (H.264)
        run: |
          out="$RUNNER_TEMP/gameplay-recording"
          ffmpeg -v error -y -i "$out/match.avi" -an -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p \
            -movflags +faststart "$out/match.mp4"
          rm "$out/match.avi"
          ls -la "$out"
      - name: Name the recording after the branch
        if: always()
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          safe=$(echo "$branch" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')
          echo "RECORDING=gameplay-${safe}-run${GITHUB_RUN_NUMBER}.mp4" >> "$GITHUB_ENV"
          echo "RECORDING_PREFIX=gameplay-${safe}-run" >> "$GITHUB_ENV"
          out="$RUNNER_TEMP/gameplay-recording"
          if [ -f "$out/match.mp4" ]; then mkdir -p "$RUNNER_TEMP/rec-upload"; cp "$out/match.mp4" "$RUNNER_TEMP/rec-upload/gameplay-${safe}-run${GITHUB_RUN_NUMBER}.mp4"; fi
      # Uploaded unzipped (upload-artifact v7, archive: false) so the link opens the video
      # in the browser.  Kept 3 days, and older recordings of this branch are deleted below.
      - name: Upload the recording (opens in the browser)
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/rec-upload/${{ env.RECORDING }}
          archive: false
          retention-days: 3
          if-no-files-found: warn
      - name: Delete this branch's older recordings
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate \
            --jq ".artifacts[] | select(.name | startswith(\"$RECORDING_PREFIX\")) | select(.id != ${{ steps.upload.outputs.artifact-id }}) | .id" |
          while read -r id; do
            echo "deleting older recording artifact $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done
      - name: Check the recording against the targets
        working-directory: arena-fc
        run: |
          out="$RUNNER_TEMP/gameplay-recording"
          python3 Tools/check_recording.py --video "$out/match.mp4" --report "$out/gameplay.json" \
            --log "$out/godot.log" --targets Tools/recording_targets.json --out "$out" \
            --summary "$GITHUB_STEP_SUMMARY" --artifact-url "${{ steps.upload.outputs.artifact-url }}"
      - name: Upload the check results, report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-fc-gameplay-recording-check
          retention-days: 7
          path: |
            ${{ runner.temp }}/gameplay-recording/recording-check.*
            ${{ runner.temp }}/gameplay-recording/gameplay.json
            ${{ runner.temp }}/gameplay-recording/godot.log
            ${{ runner.temp }}/gameplay-recording/contact-sheet.png
            ${{ runner.temp }}/gameplay-recording/preview.gif
          if-no-files-found: warn

  godot-render-captures:
    name: Godot rendered rig and gameplay captures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install software rendering and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - name: Download Godot 4.7.2 Mono
        run: |
          curl -fsSL -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          chmod +x "$RUNNER_TEMP"/godot/*/Godot_v4.7.2-stable_mono_linux.x86_64
      - name: Build Godot C# assemblies
        working-directory: arena-fc
        run: dotnet build ArenaFC.sln -c Release -v:q
      - name: Import Godot resources (textures, materials and scene assets)
        working-directory: arena-fc
        run: '"$GODOT" --headless --editor --path . --import --quit'
      - name: Run production rig grounding and animation evidence
        working-directory: arena-fc
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ARENA_FC_EVIDENCE_DIR: ${{ runner.temp }}/arena-runtime-evidence
          ARENA_FC_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$ARENA_FC_EVIDENCE_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . \
            --rendering-driver opengl3 --audio-driver Dummy res://Scenes/RuntimeEvidence.tscn
          test -s "$ARENA_FC_EVIDENCE_DIR/runtime-evidence.json"
          test -s "$ARENA_FC_EVIDENCE_DIR/production-rig-grounding.png"
      # The runtime evidence now measures mesh-derived boot soles and actual MatchEngine pass/shot release frames.
      - name: Summarize production rig measurements
        env:
          EVIDENCE_JSON: ${{ runner.temp }}/arena-runtime-evidence/runtime-evidence.json
        run: |
          python -c 'import json,os; d=json.load(open(os.environ["EVIDENCE_JSON"])); p=d["match_contact_scenarios"]; print("::notice title=Production rig evidence::commit={} slide_mps={:.4f} planted_clearance_min_m={:.4f} planted_penetrations={} swing_clearance_p95_m={:.4f} pass_contact_frames={:.3f} shot_contact_frames={:.3f} rig_p95_ms={:.3f} rig_max_ms={:.3f} bone_stretch={:.3f}".format(d["commit_sha"], d["avg_planted_foot_slide_mps"], d["planted_sole_clearance_min_m"], d["planted_sole_penetration_samples"], d["swing_sole_clearance_p95_m"], p["pass"]["error_frames"], p["shot"]["error_frames"], d["rig_update_p95_ms"], d["rig_update_max_ms"], d["max_bone_parent_distance_vs_rest"]))'
      - name: Publish compact diagnostic thumbnails
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/arena-runtime-evidence
        run: |
          for label in run-flat sprint-flat-to-ramp turn-ramp; do
            index=0
            while IFS= read -r chunk; do
              echo "::notice title=Rig thumbnail $label part $index::$chunk"
              index=$((index + 1))
            done < <(base64 -w0 "$EVIDENCE_DIR/$label-thumbnail.png" | fold -w 3000)
          done
      - name: Render procedural rig captures
        working-directory: arena-fc
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/arena-captures/rig"
          xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://Tools/rig_shot.gd -- "$RUNNER_TEMP/arena-captures/rig"
          test -s "$RUNNER_TEMP/arena-captures/rig/lineup.png"
          test -s "$RUNNER_TEMP/arena-captures/rig/upper.png"
      - name: Render browser gameplay smoke captures
        working-directory: arena-fc
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/arena-captures/gameplay"
          xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://Tools/shot.gd -- "$RUNNER_TEMP/arena-captures/gameplay"
          test -s "$RUNNER_TEMP/arena-captures/gameplay/play_0.png"
          test -s "$RUNNER_TEMP/arena-captures/gameplay/goal.png"
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-fc-rendered-captures
          path: ${{ runner.temp }}/arena-captures/
          if-no-files-found: warn
      - name: Upload production runtime metrics and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-fc-production-runtime-evidence
          path: ${{ runner.temp }}/arena-runtime-evidence/
          if-no-files-found: warn
