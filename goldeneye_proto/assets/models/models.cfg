# ======================================================================
#  Facility 64 - Enhanced graphics model manifest      (toggle with F2)
# ======================================================================
#  One [role] section per thing the game draws.  Any role whose file is
#  missing or fails to load silently falls back to the Classic look, so
#  you can replace models one at a time.  Press F3 in game to reload
#  this file and every model without restarting.
#
#  Comments start with # or ;.  Keys (all optional except file):
#    file       = model file, relative to this folder.  raylib loads
#                 .glb / .gltf (recommended, skinned + animated), .iqm,
#                 .m3d (skinned + animated), .obj / .vox (static).
#                 FBX: convert first -> tools/convert_fbx_to_glb.sh/.bat
#    anims      = separate file holding the animations (same skeleton)
#    scale      = uniform scale (game units are metres, a person ~1.8)
#    height     = instead of scale: fit the model to this height in metres
#                 (handy for FBX exported in centimetres)
#    rot        = x y z  rotation in degrees, applied after scale
#                 characters: game forward is +X, glTF models usually
#                 face +Z -> rot = 0 90 0
#                 viewmodels: authored in camera space facing +Z -> 0 180 0
#    offset     = x y z  translation after rotation (e.g. lift feet to 0)
#    clip_idle / clip_walk / clip_run / clip_aim / clip_shoot /
#    clip_reload / clip_death = animation clip names in the file.
#                 Matched case-insensitively: exact name first, then any
#                 clip containing the text.  Missing clips fall back:
#                 run->walk->idle, shoot/reload->aim->idle, idle->clip 0
#    rate_<clip> = playback speed multiplier for that clip
#    walk_speed / run_speed = ground speed (m/s) the walk/run cycles
#                 were authored for (sets the playback rate, no sliding)
#    fps        = sample rate of the clips (raylib 6 samples glTF at 60)
#    attach     = bone the held weapon is attached to (characters), or
#                 the weapon bone used for the muzzle flash (viewmodels)
#    upper_body = first bone of the upper-body layer (aim/shoot/reload
#                 play on that bone and its children over walk/run)
#    muzzle     = x y z  muzzle point in weapon/socket space (flash)
# ======================================================================

# ---------------- characters (mission guards) ----------------
[guard_soldier]
file = guard_soldier.glb
scale = 1
rot = 0 90 0
walk_speed = 1.5
run_speed = 3.6

[guard_cap]
file = guard_cap.glb
rot = 0 90 0
walk_speed = 1.5
run_speed = 3.6

[commando]
file = commando.glb
rot = 0 90 0
walk_speed = 1.5
run_speed = 3.6

# ---------------- deathmatch players ----------------
[player1]
file = agent1.glb
rot = 0 90 0
walk_speed = 1.5
run_speed = 3.8

[player2]
file = agent2.glb
rot = 0 90 0
walk_speed = 1.5
run_speed = 3.8

# ---------------- weapons held by characters / pickups ----------------
#  authored in hand-socket space: origin at the grip, barrel along +Z
[weapon_pp7]
file = w_pp7.glb
muzzle = 0 0.046 0.150

[weapon_pp7_silenced]
file = w_pp7s.glb
muzzle = 0 0.046 0.292

[weapon_kf7]
file = w_kf7.glb
muzzle = 0 0.072 0.700

[weapon_golden]
file = w_golden.glb
muzzle = 0 0.046 0.160

# ---------------- first-person viewmodels (arms + gun) ----------------
#  clips: idle (loop), shoot, reload.  Reload is stretched to the
#  weapon's reload time.
[view_pp7]
file = vm_pp7.glb
rot = 0 180 0
attach = gun
muzzle = 0 0.046 0.150

[view_pp7_silenced]
file = vm_pp7s.glb
rot = 0 180 0
attach = gun
muzzle = 0 0.046 0.292

[view_kf7]
file = vm_kf7.glb
rot = 0 180 0
attach = gun
muzzle = 0 0.072 0.700

[view_golden]
file = vm_golden.glb
rot = 0 180 0
attach = gun
muzzle = 0 0.046 0.160

# ---------------- props (front faces +Z, base at y = 0) ----------------
#  crate is 1.1 m; crate stacks reuse it at 1.2 m + 0.85 m
[prop_crate]
file = prop_crate.glb

[prop_barrel]
file = prop_barrel.glb

[prop_desk]
file = prop_desk.glb

[prop_rack]
file = prop_rack.glb
