# sprites.cfg - Sprite Forge Studio 7.0.0 (SpriteForge v1 format, read by spriteforge.h)
# move <name> <file> <frames> <frame_w> <frame_h> <fps> <loop> <row>
#   frame i of a move = rect (i*frame_w, row*frame_h, frame_w, frame_h) in <file>
#   feet of every frame on y = ground; body centre x = anchor_x; sprites face RIGHT
version 1
name rua_keeper
frame 128 128
height 81
ground 120
anchor_x 64
move idle atlas.png 8 128 128 8 1 0   # mannequin
move walk atlas.png 8 128 128 10 1 1   # mannequin
move run atlas.png 8 128 128 12 1 2   # mannequin
# view <name> <angle> <file> <source>   (same move rows as above; real | mirrored:<view> | filled:...)
view front 0 views/atlas_front.png real
view front_right 45 views/atlas_front_right.png real
view right 90 views/atlas_right.png real
view back_right 135 views/atlas_back_right.png real
view back 180 views/atlas_back.png real
view back_left 225 views/atlas_back_left.png real
view left 270 views/atlas_left.png real
view front_left 315 views/atlas_front_left.png real
